<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zia Assistant</title>
    <!-- ============================================================
         ÍNDICE DEL WIDGET — navegación rápida (busca por sección)
         1. CSS:  1.1 variables · 1.2 reset · 1.3 sidebar · 1.4 backdrop/móvil
                  1.5 header · 1.6 chat body · 1.7 welcome · 1.8 mensajes
                  1.9 input · 1.10 footer · 1.11 thinking · 1.12 toast
         2. HTML: 2.1 sidebar · 2.2 app-shell · 2.3 welcome · 2.4 mensajes
                  2.5 input · 2.6 utilidades (import/toast)
         3. JS:   3.1 config/estado · 3.2 adapter server · 3.3 adapter local
                  3.4 historyStore · 3.5 helpers UI · 3.6 sidebar/conversaciones
                  3.7 viewport · 3.8 mensajes · 3.9 envío · 3.10 eventos · 3.11 init
         ============================================================ -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&display=swap"
    />
    <!-- SDK de la JS API de Zoho Creator (v1): sin él no existe window.ZOHO.
         Requiere ZOHO.CREATOR.init() antes de usar ZOHO.CREATOR.API (ver 3.1). -->
    <script src="https://static.zohocdn.com/creator/widgets/version/1.0/widgetsdk-min.js"></script>
    <style>
      /* ============================================================
         1. CSS — estilos del widget
         ============================================================ */

      /* 1.1  Variables de tema (CSS custom properties) */
      :root {
        --primary-blue: #ff7700;
        --primary-blue-hover: #e06900;
        --text-dark: #333333;
        --text-gray: #666666;
        --text-light: #999999;
        --border-color: #e0e0e0;
        --bg-light: #f9f9f9;
        --bg-white: #ffffff;
        --footer-bg: #f5f7f9;
      }

      /* 1.2  Reset y base */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          "IBM Plex Sans",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background-color: var(--bg-white);
        color: var(--text-dark);
        height: 100vh;
        display: flex;
        flex-direction: row;
        overflow: hidden;
      }

      /* App shell (columna principal del chat) */
      .app-shell {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* 1.3  Sidebar de historial */
      .sidebar {
        width: 260px;
        flex-shrink: 0;
        overflow: hidden;
        background: var(--bg-white);
        border-right: 1px solid var(--border-color);
        transition:
          width 0.25s ease,
          transform 0.25s ease;
      }

      .sidebar-inner {
        width: 260px;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      .sidebar.collapsed {
        width: 0;
        border-right: none;
      }

      .sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        border-bottom: 1px solid var(--border-color);
      }

      .sidebar-title {
        font-size: 15px;
        font-weight: 600;
        color: var(--text-dark);
      }

      .new-chat-btn {
        width: 30px;
        height: 30px;
        border: 1px solid var(--primary-blue);
        color: var(--primary-blue);
        background: none;
        border-radius: 4px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
      }

      .new-chat-btn:hover {
        background-color: var(--primary-blue);
        color: #fff;
      }

      .sidebar-body {
        flex: 1;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: #ccc transparent;
      }

      .sidebar-body::-webkit-scrollbar {
        width: 6px;
      }
      .sidebar-body::-webkit-scrollbar-thumb {
        background-color: #ccc;
        border-radius: 10px;
      }

      .sidebar-empty {
        padding: 24px 16px;
        font-size: 13px;
        color: var(--text-light);
        text-align: center;
      }

      .conversation-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 1px solid #f0f0f0;
        cursor: pointer;
        position: relative;
        transition: background 0.15s;
      }

      .conversation-item:hover {
        background: var(--bg-light);
      }

      .conversation-item.active {
        background: #fff3e6;
        border-left: 3px solid var(--primary-blue);
      }

      .conversation-main {
        flex: 1;
        min-width: 0;
      }

      .conversation-title {
        font-size: 14px;
        font-weight: 500;
        color: var(--text-dark);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .conversation-preview {
        font-size: 12px;
        color: var(--text-gray);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 2px;
      }

      .conversation-time {
        font-size: 11px;
        color: var(--text-light);
        margin-top: 2px;
      }

      .conversation-delete {
        opacity: 0;
        flex-shrink: 0;
        border: none;
        background: none;
        color: var(--text-light);
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
        padding: 2px 6px;
        border-radius: 4px;
        transition: opacity 0.15s;
      }

      .conversation-item:hover .conversation-delete {
        opacity: 1;
      }

      .conversation-delete:hover {
        color: #d9534f;
        background: rgba(217, 83, 79, 0.1);
      }

      .sidebar-footer {
        padding: 8px 12px;
        border-top: 1px solid var(--border-color);
        display: flex;
        gap: 8px;
      }

      .sidebar-footer button {
        flex: 1;
        padding: 6px 8px;
        font-size: 12px;
        border: 1px solid var(--border-color);
        background: var(--bg-white);
        color: var(--text-gray);
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.2s;
      }

      .sidebar-footer button:hover {
        background: var(--bg-light);
        border-color: #ccc;
      }

      /* 1.4  Backdrop para el drawer en pantallas pequeñas */
      .backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        z-index: 199;
      }

      .backdrop.visible {
        display: block;
      }

      @media (max-width: 768px) {
        .sidebar {
          position: fixed;
          top: 0;
          left: 0;
          bottom: 0;
          z-index: 200;
          width: 260px;
          border-right: 1px solid var(--border-color);
          transform: translateX(-100%);
        }

        .sidebar.open {
          transform: translateX(0);
        }

        /* En móvil el estado "collapsed" se controla con .open */
        .sidebar.collapsed {
          width: 260px;
          border-right: 1px solid var(--border-color);
          transform: translateX(-100%);
        }
      }

      /* 1.5  Header (cabecera del chat) */
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 20px;
        border-bottom: 1px solid var(--border-color);
        background: var(--bg-white);
        z-index: 10;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .toggle-sidebar-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        border: none;
        background: none;
        color: var(--text-gray);
        cursor: pointer;
        border-radius: 4px;
        transition: background 0.15s;
      }

      .toggle-sidebar-btn:hover {
        background: var(--bg-light);
        color: var(--text-dark);
      }

      .header-title {
        font-size: 16px;
        font-weight: 500;
        color: var(--text-dark);
      }

      .close-btn {
        cursor: pointer;
        color: var(--text-gray);
        font-size: 20px;
        line-height: 1;
      }

      /* 1.6  Chat Body (zona de scroll) */
      .chat-container {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        padding: 20px;
        background: var(--bg-white);
        scrollbar-width: thin;
        scrollbar-color: #ccc transparent;
      }

      .chat-container::-webkit-scrollbar {
        width: 6px;
      }
      .chat-container::-webkit-scrollbar-thumb {
        background-color: #ccc;
        border-radius: 10px;
      }

      /* 1.7  Welcome (robot + sugerencias) */
      .welcome-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        margin-top: 20px;
        margin-bottom: 30px;
      }

      .zia-robot {
        width: 120px;
        height: 120px;
        margin-bottom: 20px;
      }

      .welcome-title {
        font-size: 22px;
        font-weight: 500;
        margin-bottom: 12px;
        line-height: 1.3;
      }

      .welcome-subtitle {
        font-size: 15px;
        color: var(--text-dark);
        margin-bottom: 20px;
      }

      /* Suggestion Chips */
      .suggestions {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        width: 100%;
        max-width: 620px;
      }

      .suggestion-chip {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        background: var(--bg-white);
        cursor: pointer;
        transition:
          background 0.2s,
          border-color 0.2s;
        text-align: left;
        font-size: 12px;
        color: var(--text-gray);
        min-height: 52px;
      }

      .suggestion-chip:hover {
        background: var(--bg-light);
        border-color: #ccc;
      }

      .suggestion-icon {
        font-size: 15px;
        opacity: 0.7;
        flex-shrink: 0;
      }

      /* 1.8  Lista de mensajes */
      .message-list {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .message {
        max-width: 85%;
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 14px;
        line-height: 1.5;
        word-wrap: break-word;
        white-space: pre-wrap; /* conserva los saltos de línea de las respuestas Deluge */
      }

      .message.user {
        align-self: flex-end;
        background-color: #fff3e6;
        border: 1px solid #ffd9b3;
        color: var(--text-dark);
      }

      .message.ai {
        align-self: flex-start;
        background-color: var(--bg-light);
        border: 1px solid var(--border-color);
        color: var(--text-dark);
      }

      /* 1.8b  Visualización (tablas y gráficas de barras) */
      .zc-viz-container {
        margin-top: 8px;
        padding: 8px 0;
      }
      .zc-viz-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-gray);
        margin-bottom: 8px;
      }
      .zc-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      .zc-table th,
      .zc-table td {
        padding: 6px 10px;
        border-bottom: 1px solid var(--border-color);
        text-align: left;
      }
      .zc-table th {
        font-weight: 600;
        color: var(--text-gray);
      }
      .zc-bar-chart {
        display: flex;
        align-items: flex-end;
        gap: 12px;
        height: 160px;
        padding: 10px 0;
      }
      .zc-bar-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        flex: 1;
        height: 100%;
        min-width: 0;
      }
      .zc-bar {
        width: 100%;
        max-width: 40px;
        background: var(--primary-blue);
        border-radius: 4px 4px 0 0;
        transition: height 0.3s ease;
      }
      .zc-bar-value {
        font-size: 11px;
        margin-bottom: 4px;
        color: var(--text-gray);
      }
      .zc-bar-label {
        font-size: 11px;
        margin-top: 6px;
        color: var(--text-gray);
        text-align: center;
        word-break: break-word;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 60px;
      }

      /* 1.8c  Exportación de visualizaciones (toolbar + submenú CSV/XLSX) */
      .zc-viz-toolbar {
        display: flex;
        justify-content: flex-end;
        margin-top: 8px;
        position: relative;
      }
      .zc-export-btn {
        border: 1px solid var(--border-color);
        background: var(--bg-white);
        color: var(--text-dark);
        padding: 4px 10px;
        font-size: 12px;
        border-radius: 4px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .zc-export-btn:hover,
      .zc-export-btn:focus-visible {
        border-color: var(--primary-blue);
        color: var(--primary-blue);
      }
      .zc-export-btn[aria-expanded="true"] {
        border-color: var(--primary-blue);
        color: var(--primary-blue);
      }
      .zc-export-menu {
        position: absolute;
        right: 0;
        top: calc(100% + 4px);
        z-index: 20;
        background: var(--bg-white);
        border: 1px solid var(--border-color);
        border-radius: 4px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        display: none;
        flex-direction: column;
        padding: 4px;
      }
      .zc-export-menu.open {
        display: flex;
      }
      .zc-export-menu button {
        border: none;
        background: transparent;
        color: var(--text-dark);
        text-align: left;
        padding: 6px 12px;
        font-size: 13px;
        border-radius: 3px;
        cursor: pointer;
        white-space: nowrap;
      }
      .zc-export-menu button:hover,
      .zc-export-menu button:focus-visible {
        background: var(--bg-light);
        color: var(--primary-blue);
      }
      .zc-export-menu button:disabled {
        color: var(--text-light);
        cursor: not-allowed;
        background: transparent;
      }

      /* 1.9  Input y botón enviar */
      .input-area {
        padding: 16px 20px;
        background: var(--bg-white);
      }

      .input-wrapper {
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 12px;
        position: relative;
        display: flex;
        flex-direction: column;
      }

      .input-wrapper:focus-within {
        border-color: var(--primary-blue);
      }

      #chatInput {
        width: 100%;
        border: none;
        outline: none;
        resize: none;
        font-family: inherit;
        font-size: 15px;
        min-height: 60px;
        max-height: 150px;
        color: var(--text-dark);
      }

      #chatInput::placeholder {
        color: var(--text-light);
      }

      .btn-container {
        display: flex;
        justify-content: flex-end;
        margin-top: 8px;
      }

      .send-btn {
        background-color: transparent;
        color: var(--primary-blue);
        border: 1px solid var(--primary-blue);
        border-radius: 4px;
        padding: 6px 16px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: all 0.2s;
      }

      .send-btn:hover:not(:disabled) {
        background-color: var(--primary-blue);
        color: white;
      }

      .send-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* 1.10  Footer */
      .footer {
        background-color: var(--footer-bg);
        padding: 12px 20px;
        border-top: 1px solid var(--border-color);
        font-size: 13px;
        color: var(--text-gray);
        line-height: 1.4;
      }

      .footer a {
        color: var(--primary-blue);
        text-decoration: none;
      }

      .footer a:hover {
        text-decoration: underline;
      }

      /* 1.11  Indicador thinking (animación) */
      .thinking {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        background-color: var(--bg-light);
        border-radius: 8px;
        align-self: flex-start;
        border: 1px solid var(--border-color);
      }

      .thinking .dots {
        display: flex;
        gap: 4px;
      }

      .dot {
        width: 6px;
        height: 6px;
        background: var(--text-light);
        border-radius: 50%;
        animation: blink 1.4s infinite both;
      }

      .dots .dot:nth-child(2) {
        animation-delay: 0.2s;
      }
      .dots .dot:nth-child(3) {
        animation-delay: 0.4s;
      }

      .thinking-label {
        font-size: 13px;
        color: var(--text-gray);
      }

      /* Señal de vida: pulso sutil cuando la respuesta tarda */
      .thinking.still-working .thinking-label {
        animation: still-pulse 1.8s ease-in-out infinite;
      }

      @keyframes blink {
        0%,
        80%,
        100% {
          opacity: 0.2;
        }
        40% {
          opacity: 1;
        }
      }

      @keyframes still-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .dot {
          animation: none;
          opacity: 0.5;
        }
        .thinking.still-working .thinking-label {
          animation: none;
        }
      }

      /* 1.12  Toast de feedback (export/import) */
      .toast {
        position: fixed;
        left: 50%;
        bottom: 90px;
        transform: translateX(-50%) translateY(10px);
        background: rgba(51, 51, 51, 0.92);
        color: #fff;
        font-size: 13px;
        padding: 8px 14px;
        border-radius: 6px;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.2s,
          transform 0.2s;
        z-index: 300;
      }

      .toast.visible {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <!-- ============================================================
         2. HTML — estructura del widget
         ============================================================ -->

    <!-- 2.1  Sidebar de historial de conversaciones -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-inner">
        <div class="sidebar-header">
          <span class="sidebar-title">Conversations</span>
          <button
            class="new-chat-btn"
            id="newChatBtn"
            title="New conversation"
            aria-label="New conversation"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
            >
              <path d="M12 5v14M5 12h14" />
            </svg>
          </button>
        </div>
        <nav class="sidebar-body" id="conversationList" aria-label="Conversation history"></nav>
        <div class="sidebar-footer">
          <button id="exportBtn" title="Export conversations as JSON">Export</button>
          <button id="importBtn" title="Import conversations from JSON">Import</button>
        </div>
      </div>
    </aside>

    <div class="backdrop" id="backdrop"></div>

    <!-- 2.2  App shell (zona principal del chat) -->
    <div class="app-shell">
      <header class="header">
        <div class="header-left">
          <button
            class="toggle-sidebar-btn"
            id="toggleSidebarBtn"
            title="Toggle history"
            aria-label="Toggle conversation history"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <path d="M3 6h18M3 12h18M3 18h18" />
            </svg>
          </button>
          <span class="header-title">Marketing & Sales Assistant</span>
        </div>
        <span class="close-btn">&times;</span>
      </header>

      <main class="chat-container" id="chatContainer">
        <!-- 2.3  Welcome (pantalla inicial) -->
        <div id="welcomeScreen" class="welcome-section">
          <div class="zia-robot">

              viewBox="362 130 300 300"

        EXPORT_TEMPLATES: {

        // Sugerencias UI — FUENTE ÚNICA de verdad (el backend NO las tiene).

      // Plantilla genérica de respaldo para tools sin entrada en EXPORT_TEMPLATES.
      // Los headers/valores siempre salen del shape; sin columns no se aplican anchos.
      const GENERIC_EXPORT_TEMPLATE = {
        filename: "export-{toolName}-{date}",
        sheetName: "Datos",
        freezePane: { ySplit: 1 },
        autoFilter: true,
        headerStyle: { bold: true, bg: "FFF3E6", color: "333333" },

      const MAX_CONVERSATIONS = 50;
      const STORAGE_KEY = "lm2chatbot:conversations";
      const COLLAPSED_KEY = "lm2chatbot:sidebarCollapsed";

      const state = {
        currentConv: null, // conversación activa: { id, title, createdAt, updatedAt, messages }
        messages: [], // alias de currentConv.messages
        isLoading: false,
      };

      // Refs del DOM
      const chatInput = document.getElementById("chatInput");
      const sendBtn = document.getElementById("sendBtn");
      const chatContainer = document.getElementById("chatContainer");
      const welcomeScreen = document.getElementById("welcomeScreen");
      const messageList = document.getElementById("messageList");

      // ------------------------------------------------------------------
      // historyStore — adaptador de persistencia
      // Capa server (Client API de Zoho Creator): ChatSessions/ChatMessages
      //   para el historial y ChatRequests (job asíncrono + polling) para las
      //   respuestas. La UI consume la misma interfaz: list/get/create/update/remove.
      // Capa local (localStorage): sin backend — vista previa / modo local.
      // ------------------------------------------------------------------
      // El modo NO se decide en el parseo: el SDK (v1) expone ZOHO.CREATOR.API
      // solo después de ZOHO.CREATOR.init(), así que esperamos a que resuelva
      // (con timeout de respaldo para la vista previa fuera de Creator).
      let BACKEND_MODE = "local";

      async function resolveBackendMode() {
        if (CONFIG.forceLocal) return "local";
        if (!(window.ZOHO && ZOHO.CREATOR && typeof ZOHO.CREATOR.init === "function")) {
          return "local";
        }
        try {
          await Promise.race([
            ZOHO.CREATOR.init(),
            new Promise((r) => setTimeout(r, 3000)),
          ]);
        } catch (err) {
          console.error("ZOHO.CREATOR.init", err);
          return "local";
        }
        return ZOHO.CREATOR && ZOHO.CREATOR.API ? "server" : "local";
      }

      // --- Cliente mínimo sobre ZOHO.CREATOR.API (callback + promesa + timeout) ---
      // El widgets SDK (version/1.0) puede invocar el callback O devolver una
      // Promise, según la versión que Zoho sirva. Peor aún: algunas versiones
      // ejecutan la operación (el registro se crea) pero NUNCA resuelven la
      // llamada. Sin timeout el widget se cuelga para siempre en el await.
      // Este wrapper resuelve con cualquiera de las dos vías + timeout.
      // ==== 3.2  Adapter server (Client API) ====
      function clientApi(method, config, timeoutMs) {
        return new Promise((resolve) => {
          const fn = ZOHO.CREATOR.API[method];
          if (!fn) {
            resolve({ code: 0, message: "Client API method not found: " + method });
            return;
          }
          let settled = false;
          let timer = null;
          const done = (res) => {
            if (!settled) {
              settled = true;
              clearTimeout(timer);
              resolve(res || {});
            }
          };
          timer = setTimeout(
            () => done({ code: 0, timedOut: true, message: "Client API timeout: " + method }),
            timeoutMs || 8000
          );
          try {
            const maybePromise = fn(config, done);
            if (maybePromise && typeof maybePromise.then === "function") {
              maybePromise.then(
                (res) => done(res),
                (err) => done({ code: 0, message: "Client API call failed: " + ((err && err.message) || err) })
              );
            }
          } catch (err) {
            done({ code: 0, message: "Client API call failed: " + ((err && err.message) || err) });
          }
        });
      }

      async function apiGetAll(reportName, opts) {
        const params = { appName: CONFIG.appName, reportName: reportName, page: 1, limit: 200 };
        if (opts) {
          if (opts.page) params.page = opts.page;
          if (opts.limit) params.limit = opts.limit;
          if (opts.criteria) params.criteria = opts.criteria;
        }
        const res = await clientApi("getAllRecords", params);
        const data = res && (res.data || res.records);
        if (Array.isArray(data)) return data;
        // Reporte vacío: la REST API v2 responde 404 con code 3100
        // ("No Data Available") cuando el reporte existe pero no tiene registros.
        if (res && Number(res.code) === 3100) return [];
        throw new Error("getAllRecords(" + reportName + ") failed: " + (res && res.message));
      }

      const _MONTHS = {
        Jan: "01", Feb: "02", Mar: "03", Apr: "04", May: "05", Jun: "06",
        Jul: "07", Aug: "08", Sep: "09", Oct: "10", Nov: "11", Dec: "12",
      };
      function toTimestamp(v) {
        if (!v) return 0;
        if (typeof v === "number") return v;
        let s = String(v).trim();
        if (!s) return 0;
        // Zoho Creator formato live: "17-Aug-2026 22:35:37" → ISO numérico
        const zm = s.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})\s+(.+)$/);
        if (zm && _MONTHS[zm[2]]) {
          s = `${zm[3]}-${_MONTHS[zm[2]]}-${zm[1].padStart(2, "0")}T${zm[4]}Z`;
        } else if (!s.includes("T")) {
          // "2026-08-05 10:00:00" → ISO UTC (Creator devuelve UTC)
          s = s.replace(" ", "T") + "Z";
        }
        const t = Date.parse(s);
        return isNaN(t) ? 0 : t;
      }

      function sleep(ms) {
        return new Promise((r) => setTimeout(r, ms));
      }

      // --- Capa servidor: lectura/escritura sobre los módulos de Creator ---
      async function fetchSessions() {
        const recs = await apiGetAll(CONFIG.chatSessionsReport, { limit: MAX_CONVERSATIONS });
        return recs
          .filter((r) => r.Session_ID)
          .map((r) => ({
            id: r.Session_ID,
            title: r.Title || "",
            createdAt: toTimestamp(r.Created_Time),
            updatedAt: toTimestamp(r.Last_Activity) || toTimestamp(r.Modified_Time),
            messages: [], // se cargan bajo demanda al abrir la conversación
          }))
          .sort((a, b) => b.updatedAt - a.updatedAt);
      }

      async function loadThread(convId) {
        // Sin criteria string: el API del live rechaza Session_ID == '<uuid>'
        // con 3330 (parsea el valor como DATE-TIME). Se filtra en JS.
        const sessions = await apiGetAll(CONFIG.chatSessionsReport, { limit: 200 });
        const session = (sessions || []).find((s) => s.Session_ID === convId);
        if (!session) return null;
        const msgs = await apiGetAll(CONFIG.chatMessagesReport, {
          criteria: "Session == " + session.ID,
          limit: 200,
        });
        // IDs de Creator son strings de 19 dígitos — Number() pierde precisión.
        // Comparación string lexicográfica es cronológica para IDs de mismo largo.
        msgs.sort((a, b) => String(a.ID || "").localeCompare(String(b.ID || "")));
        return {
          title: session.Title || "",
          messages: msgs.map((m) => ({
            role: String(m.Role || "ai").toLowerCase(),
            content: m.Content || "",
          })),
        };
      }

      // Envía un prompt al backend: crea ChatRequests (workflow On Submit →
      // chat_invoke) y hace polling del Status hasta answered/failed.
      async function sendToServer(convId, prompt) {
        const recordData = {
          [CONFIG.chatRequestsFields.sessionId]: convId,
          [CONFIG.chatRequestsFields.prompt]: prompt,
        };
        console.log("[LM2Chatbot] sendToServer payload:", recordData);
        const res = await clientApi(
          "addRecord",
          {
            appName: CONFIG.appName,
            formName: CONFIG.chatRequestsForm,
            data: { data: recordData },
          },
          5000
        );
        console.log("[LM2Chatbot] addRecord response:", res);
        if (res && res.timedOut) {
          // El SDK creó el registro pero nunca respondió (bug observado del
          // widgets SDK): continuar al polling, filtrando Session_ID en JS.
          console.warn("[LM2Chatbot] addRecord sin respuesta del SDK; el registro suele crearse igual.");
        } else if (!res || Number(res.code) !== 3000) {
          console.error("[LM2Chatbot] addRecord failed:", res);
          throw new Error("addRecord(ChatRequests) failed: " + (res && res.message));
        }

        // Poll por ID del registro recién creado. El criteria por Session_ID
        // es frágil: el API del live parsea strings con formato de fecha como
        // DATE-TIME y rechaza con code 3330 (Invalid criteria specified).
        const createdId = res && res.data && (res.data.ID || (res.data[0] && res.data[0].ID));

        const deadline = Date.now() + CONFIG.pollTimeoutMs;
        let lastError = null;
        // ID del registro ACTUAL de esta solicitud. Si addRecord devolvió ID lo
        // usamos directo; si no (timeout del SDK), se resuelve abajo en el
        // primer poll sin depender de Created_Time.
        let pollId = createdId || null;
        while (Date.now() < deadline) {
          await sleep(CONFIG.pollIntervalMs);
          let recs;
          try {
            if (pollId) {
              // ID numérico: criteria seguro (sin parseo de fecha)
              recs = await apiGetAll(CONFIG.chatRequestsReport, {
                criteria: "ID == " + pollId,
                limit: 10,
              });
            } else {
              // Sin criteria: el live rechaza Session_ID == '<valor>' con 3330.
              // Se trae la página 1 y se filtra Session_ID en JS.
              recs = await apiGetAll(CONFIG.chatRequestsReport, { limit: 200 });
              recs = (recs || []).filter((r) => r.Session_ID === convId);
              // El live puede no exponer Created_Time en el reporte: si el sort
              // quedaba todo en cero, recs[0] era el PRIMER registro de la
              // conversación (el saludo) → respondía siempre lo mismo.
              // Identificar el registro ACTUAL sin depender de la fecha:
              // 1) el que está pendiente (recién creado, workflow corriendo)
              // 2) el que matchea el Prompt que acabamos de enviar
              // 3) último recurso: el más nuevo por Created_Time
              const current =
                recs.find((r) => r.Status === "pending" || r.Status === "processing") ||
                recs.find((r) => r.Prompt === prompt) ||
                recs.sort((a, b) => toTimestamp(b.Created_Time) - toTimestamp(a.Created_Time))[0];
              if (!current) continue;
              pollId = current.ID;
              recs = [current];
            }
            console.log("[LM2Chatbot] poll:", { mode: pollId ? "by-id" : "filter-js", recs: recs });
          } catch (err) {
            lastError = err;
            console.error("[LM2Chatbot] poll error:", err);
            continue;
          }
          recs.sort((a, b) => toTimestamp(b.Created_Time) - toTimestamp(a.Created_Time));
          const latest = recs[0];
          if (!latest) continue;
          const status = String(latest.Status || "");
          if (status === "answered") {
            // Fallback si el reporte no expone Reply: último mensaje ai del hilo
            let reply = latest.Reply || "";
            if (!reply) reply = await replyFallback(convId);
            return { ok: true, reply: reply };
          }
          if (status === "failed") {
            return { ok: false, error: latest.Error || "Error en el servidor." };
          }
        }
        return {
          ok: false,
          error: lastError
            ? "No se pudo contactar el servidor. Revisa la conexión e intenta de nuevo."
            : "La solicitud tardó demasiado (" +
              Math.round(CONFIG.pollTimeoutMs / 1000) +
              " s). Por favor intenta de nuevo.",
        };
      }

      // Borra TODAS las sesiones que comparten Session_ID (el backend puede
      // crear varias por mensaje — ver replyFallback). Devuelve:
      //   { deleted: n, ok: true }  si todos los deleteRecord confirmaron
      //   { deleted: n, ok: false } si algún deleteRecord falló o expiró
      async function deleteSessionOnServer(convId) {
        // Sin criteria string (mismo motivo: 3330 en el live). Filtrado en JS.
        let ok = true;
        async function deleteAll(formName, recs) {
          for (const rec of recs) {
            const res = await clientApi("deleteRecord", {
              appName: CONFIG.appName,
              formName: formName,
              id: rec.ID,
            });
            // El widgets SDK puede ejecutar el borrado pero nunca responder
            // (bug observado en addRecord) o devolver un error real; en ambos
            // casos no podemos dar por borrado algo que el servidor aún tiene.
            if (!res || Number(res.code) !== 3000 || res.timedOut) ok = false;
          }
        }

        const allSessions = await apiGetAll(CONFIG.chatSessionsReport, { limit: 200 });
        // Puede haber VARIAS sesiones con el mismo Session_ID (bug del backend
        // que crea una por mensaje): borrarlas TODAS o reaparecen al recargar.
        const sessions = (allSessions || []).filter((s) => s.Session_ID === convId);
        for (const session of sessions) {
          const msgs = await apiGetAll(CONFIG.chatMessagesReport, {
            criteria: "Session == " + session.ID,
            limit: 200,
          });
          await deleteAll(CONFIG.chatMessagesForm, msgs);
          const res = await clientApi("deleteRecord", {
            appName: CONFIG.appName,
            formName: CONFIG.chatSessionsForm,
            id: session.ID,
          });
          if (!res || Number(res.code) !== 3000 || res.timedOut) ok = false;
        }
        let reqs = await apiGetAll(CONFIG.chatRequestsReport, { limit: 200 });
        reqs = (reqs || []).filter((r) => r.Session_ID === convId);
        await deleteAll(CONFIG.chatRequestsForm, reqs);

        return { deleted: sessions.length, ok: ok };
      }

      // Si el reporte ChatRequests no expone Reply en el live, lee el último
      // mensaje "ai" del hilo desde ChatMessages_Report.
      async function replyFallback(convId) {
        try {
          const sessions = await apiGetAll(CONFIG.chatSessionsReport, { limit: 200 });
          // Puede haber VARIAS sesiones con el mismo Session_ID (bug del backend
          // que crea una sesión por mensaje). Con .find() agarraba SIEMPRE la
          // primera sesión → respondía lo mismo a todo. Usar la MÁS RECIENTE.
          const session = (sessions || [])
            .filter((s) => s.Session_ID === convId)
            .sort((a, b) => toTimestamp(b.Created_Time) - toTimestamp(a.Created_Time))[0];
          if (!session) return "";
          const msgs = await apiGetAll(CONFIG.chatMessagesReport, {
            criteria: "Session == " + session.ID,
            limit: 50,
          });
          const ai = (msgs || [])
            .filter((m) => String(m.Role || "").toLowerCase() === "ai")
            .sort((a, b) => toTimestamp(b.Created_Time) - toTimestamp(a.Created_Time))[0];
          return (ai && ai.Content) || "";
        } catch (err) {
          console.error("[LM2Chatbot] replyFallback failed:", err);
          return "";
        }
      }

      // --- Capa local (localStorage) ---
      // ==== 3.3  Adapter local (localStorage) ====
      function localList() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const arr = raw ? JSON.parse(raw) : [];
          if (!Array.isArray(arr)) return [];
          return arr
            .filter((c) => c && c.id && Array.isArray(c.messages))
            .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
        } catch (err) {
          console.error("historyStore.list", err);
          return [];
        }
      }

      function localSaveAll(all) {
        const trimmed = all.slice(0, MAX_CONVERSATIONS);
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(trimmed));
        } catch (err) {
          console.error("localSaveAll", err);
        }
      }

      // --- Store: misma interfaz para ambas capas ---
      // ==== 3.4  historyStore — capa unificada (server|local) ====
      const historyStore = {
        mode: BACKEND_MODE,
        _cache: [], // servidor: sesiones cargadas (con mensajes si se abrieron)

        async init() {
          if (this.mode !== "server") return;
          try {
            this._cache = await fetchSessions();
          } catch (err) {
            console.error("historyStore.init", err);
          }
        },

        // Recarga metadatos de sesiones conservando los mensajes ya cargados
        async refreshSessions() {
          if (this.mode !== "server") return;
          try {
            const sessions = await fetchSessions();
            const byId = new Map(this._cache.map((c) => [c.id, c]));
            this._cache = sessions.map((s) => {
              const existing = byId.get(s.id);
              return existing && existing.messages.length
                ? Object.assign({}, existing, { title: s.title, updatedAt: s.updatedAt })
                : s;
            });
          } catch (err) {
            console.error("historyStore.refreshSessions", err);
          }
        },

        list() {
          if (this.mode === "server") {
            return this._cache.slice().sort((a, b) => b.updatedAt - a.updatedAt);
          }
          return localList();
        },

        get(id) {
          if (this.mode !== "server") {
            return this.list().find((c) => c.id === id) || null;
          }
          return this._cache.find((c) => c.id === id) || null;
        },

        // Carga un hilo completo (mensajes) — en servidor hace fetch bajo demanda
        async load(id) {
          if (this.mode !== "server") return this.get(id);
          const cached = this.get(id);
          if (cached && cached.messages.length) return cached;
          const thread = await loadThread(id);
          if (!thread) return null;
          const conv = {
            id: id,
            title: thread.title || (cached && cached.title) || "",
            createdAt: cached ? cached.createdAt : 0,
            updatedAt: cached ? cached.updatedAt : 0,
            messages: thread.messages,
          };
          this._upsert(conv);
          return conv;
        },

        create(conv) {
          if (this.mode === "server") {
            this._upsert(conv); // la sesión se crea en servidor con el primer envío
            return;
          }
          const all = localList();
          all.unshift(conv);
          localSaveAll(all);
        },

        update(conv) {
          if (this.mode === "server") {
            this._upsert(conv); // servidor mantiene title/Last_Activity (refreshSessions)
            return;
          }
          const all = localList();
          const i = all.findIndex((c) => c.id === conv.id);
          if (i !== -1) all[i] = conv;
          else all.unshift(conv);
          localSaveAll(all);
        },

        // Devuelve true si se eliminó (o no existía), false si el servidor falló.
        async remove(id) {
          if (this.mode === "server") {
            try {
              const res = await deleteSessionOnServer(id);
              if (!res || res.ok === false) {
                // El servidor aún tiene la conversación: refrescar el cache
                // para reflejar la verdad (si no, "borrada" reaparece al recargar).
                console.warn("historyStore.remove: server delete failed for", id);
                await this.refreshSessions();
                return false;
              }
            } catch (err) {
              console.error("historyStore.remove", err);
              await this.refreshSessions();
              return false;
            }
            this._cache = this._cache.filter((c) => c.id !== id);
            return true;
          }
          localSaveAll(localList().filter((c) => c.id !== id));
          return true;
        },

        // Envía un mensaje y devuelve la respuesta del agente
        async send(convId, prompt) {
          if (this.mode !== "server") {
            await sleep(600);
            return {
              ok: true,
              reply:
                "This is a simulated response. Run the widget inside Zoho Creator to use the real backend (Client API).",
            };
          }
          return sendToServer(convId, prompt);
        },

        _upsert(conv) {
          const i = this._cache.findIndex((c) => c.id === conv.id);
          if (i !== -1) this._cache[i] = conv;
          else this._cache.unshift(conv);
        },
      };

      // ------------------------------------------------------------------
      // Utilidades
      // ------------------------------------------------------------------
      // ==== 3.5  Helpers de formato y UI ====
      function truncate(str, max) {
        const s = String(str || "").replace(/\s+/g, " ").trim();
        return s.length > max ? s.slice(0, max - 1) + "…" : s;
      }

      function timeAgo(ts) {
        if (!ts) return "";
        const diff = Date.now() - ts;
        const mins = Math.floor(diff / 60000);
        if (mins < 1) return "now";
        if (mins < 60) return mins + "m ago";
        const hrs = Math.floor(mins / 60);
        if (hrs < 24) return hrs + "h ago";
        const days = Math.floor(hrs / 24);
        if (days < 7) return days + "d ago";
        return new Date(ts).toLocaleDateString();
      }

      let toastTimer = null;
      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add("visible");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("visible"), 2200);
      }

      // ------------------------------------------------------------------
      // Sidebar de historial
      // ------------------------------------------------------------------
      function sidebarEmptyEl() {
        const el = document.createElement("div");
        el.className = "sidebar-empty";
        el.textContent = "No conversations yet";
        return el;
      }

      function conversationItemEl(conv) {
        const el = document.createElement("div");
        el.className =
          "conversation-item" + (conv.id === state.currentConv?.id ? " active" : "");
        el.dataset.id = conv.id;

        const main = document.createElement("div");
        main.className = "conversation-main";

        const title = document.createElement("div");
        title.className = "conversation-title";
        title.textContent = conv.title || "Untitled";

        const last = conv.messages[conv.messages.length - 1];
        const preview = document.createElement("div");
        preview.className = "conversation-preview";
        if (last) preview.textContent = truncate(last.content, 60);
        preview.style.display = last ? "" : "none"; // server: sin mensajes aún

        const time = document.createElement("div");
        time.className = "conversation-time";
        time.textContent = timeAgo(conv.updatedAt);

        main.appendChild(title);
        main.appendChild(preview);
        main.appendChild(time);

        const del = document.createElement("button");
        del.className = "conversation-delete";
        del.title = "Delete conversation";
        del.setAttribute("aria-label", "Delete conversation");
        del.textContent = "\u00d7";

        el.appendChild(main);
        el.appendChild(del);
        return el;
      }

      // ==== 3.6  Sidebar y conversaciones ====
      function renderSidebar() {
        conversationList.innerHTML = "";
        const convs = historyStore.list();
        if (!convs.length) {
          conversationList.appendChild(sidebarEmptyEl());
          return;
        }
        convs.forEach((conv) => conversationList.appendChild(conversationItemEl(conv)));
      }

      function newChat() {
        if (state.isLoading) return;
        state.currentConv = null;
        state.messages = [];
        messageList.innerHTML = "";
        messageList.classList.add("hidden");
        welcomeScreen.classList.remove("hidden");
        renderSidebar();
        chatInput.focus();
      }

      async function selectConversation(id) {
        if (state.isLoading) return;
        let conv;
        try {
          conv = await historyStore.load(id);
        } catch (err) {
          console.error("selectConversation", err);
          showToast("Failed to load conversation");
          return;
        }
        if (!conv) return;
        state.currentConv = conv;
        state.messages = conv.messages;
        welcomeScreen.classList.add("hidden");
        messageList.classList.remove("hidden");
        messageList.innerHTML = "";
        conv.messages.forEach((m) => renderMessageNode(m.content, m.role));
        scrollToBottom();
        renderSidebar();
      }

      async function deleteConversation(id) {
        if (state.currentConv?.id === id && state.isLoading) return;
        const removed = await historyStore.remove(id);
        if (removed === false) {
          showToast("No se pudo eliminar la conversación en el servidor");
          renderSidebar();
          return;
        }
        showToast("Conversación eliminada");
        if (state.currentConv?.id === id) {
          newChat();
        } else {
          renderSidebar();
        }
      }

      function ensureCurrentConversation() {
        if (state.currentConv) return;
        const now = Date.now();
        const id =
          window.crypto && crypto.randomUUID
            ? crypto.randomUUID()
            : "c_" + now + "_" + Math.random().toString(36).slice(2, 8);
        state.currentConv = { id, title: "", createdAt: now, updatedAt: now, messages: [] };
        state.messages = state.currentConv.messages;
        historyStore.create(state.currentConv);
        renderSidebar();
      }

      function persistCurrentConversation() {
        if (!state.currentConv) return;
        const conv = state.currentConv;
        conv.updatedAt = Date.now();
        if (!conv.title && conv.messages.length) {
          const first = conv.messages.find((m) => m.role === "user");
          if (first) conv.title = truncate(first.content, 42);
        }
        historyStore.update(conv);
        renderSidebar();
      }

      // ------------------------------------------------------------------
      // Drawer responsive (sidebar superpuesta en pantallas pequeñas)
      // ------------------------------------------------------------------
      // ==== 3.7  Viewport responsive (móvil / escritorio) ====
      const mq = window.matchMedia("(max-width: 768px)");

      function applyViewportMode() {
        if (mq.matches) {
          sidebar.classList.remove("collapsed");
          sidebar.classList.remove("open");
          backdrop.classList.remove("visible");
        } else {
          sidebar.classList.remove("open");
          backdrop.classList.remove("visible");
          let collapsed = false;
          try {
            collapsed = localStorage.getItem(COLLAPSED_KEY) === "1";
          } catch (err) {
            console.error(err);
          }
          sidebar.classList.toggle("collapsed", collapsed);
        }
      }

      mq.addEventListener("change", applyViewportMode);

      // ================================================================
      // 3.8  Mensajes — render, thinking, scroll
      // ================================================================
      // --- Visualización: motor de render (bar + table, sin dependencias) ---

      // Reparación de JSON con newlines literales (mensajes guardados antes del
      // fix de escaping). Reemplaza \n \r \t dentro de strings JSON por sus
      // secuencias escapadas, respetando el contexto de string vs fuera de string.
      function repairJson(raw) {
        let out = "";
        let inStr = false;
        for (let i = 0; i < raw.length; i++) {
          const ch = raw[i];
          if (ch === '"') {
            // Verificar si es comilla escapada (\")
            let bs = 0;
            let j = i - 1;
            while (j >= 0 && raw[j] === "\\") { bs++; j--; }
            if (bs % 2 === 0) {
              // Comilla real: alterna inStr
              inStr = !inStr;
            }
            out += ch;
          } else if (inStr) {
            if (ch === "\n") { out += "\\n"; }
            else if (ch === "\r") { out += "\\r"; }
            else if (ch === "\t") { out += "\\t"; }
            else { out += ch; }
          } else {
            out += ch;
          }
        }
        return out;
      }

      function renderTable(viz, container) {
        const table = document.createElement("table");
        table.className = "zc-table";
        const thead = document.createElement("thead");
        const headRow = document.createElement("tr");
        // Headers: "Categoría" + nombre de cada serie
        const thLabel = document.createElement("th");
        thLabel.textContent = "Categoría";
        headRow.appendChild(thLabel);
        (viz.series || []).forEach((s) => {
          const th = document.createElement("th");
          th.textContent = s.name;
          headRow.appendChild(th);
        });
        thead.appendChild(headRow);
        table.appendChild(thead);

        const tbody = document.createElement("tbody");
        (viz.labels || []).forEach((label, i) => {
          const tr = document.createElement("tr");
          const tdLabel = document.createElement("td");
          tdLabel.textContent = label;
          tr.appendChild(tdLabel);
          (viz.series || []).forEach((s) => {
            const td = document.createElement("td");
            td.textContent = s.values[i] != null ? s.values[i] : "";
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        container.appendChild(table);
      }

      function renderBarChart(viz, container) {
        const values = (viz.series && viz.series[0] && viz.series[0].values) || [];
        const maxVal = Math.max(...values, 1);
        const chart = document.createElement("div");
        chart.className = "zc-bar-chart";

        (viz.labels || []).forEach((label, i) => {
          const val = values[i] || 0;
          const pct = (val / maxVal) * 100;
          const barWrap = document.createElement("div");
          barWrap.className = "zc-bar-wrap";
          const barValue = document.createElement("div");
          barValue.className = "zc-bar-value";
          barValue.textContent = val;
          const bar = document.createElement("div");
          bar.className = "zc-bar";
          bar.style.height = "0%";
          const barLabel = document.createElement("div");
          barLabel.className = "zc-bar-label";
          barLabel.textContent = label;
          barLabel.title = label;
          barWrap.appendChild(barValue);
          barWrap.appendChild(bar);
          barWrap.appendChild(barLabel);
          chart.appendChild(barWrap);
          // Animar entrada: height desde 0
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              bar.style.height = pct + "%";
            });
          });
        });
        container.appendChild(chart);
      }

      function renderVisualization(viz, container) {
        if (!viz || viz.type === "none" || !viz.type) return;
        const wrapper = document.createElement("div");
        wrapper.className = "zc-viz-container";
        if (viz.title) {
          const title = document.createElement("div");
          title.className = "zc-viz-title";
          title.textContent = viz.title;
          wrapper.appendChild(title);
        }
        switch (viz.type) {
          case "table":
            renderTable(viz, wrapper);
            break;
          case "bar":
            renderBarChart(viz, wrapper);
            break;
          // "line" se soportará en fase 2
        }
        // Toolbar de exportación en la misma wrapper solo para table/bar.
        renderExportToolbar(wrapper, resolveExportContext(null, viz));
        container.appendChild(wrapper);
      }

      // ================================================================
      // 3.8b  Exportación de visualizaciones (CSV nativo + XLSX via SheetJS)
      // ================================================================
      // El envelope de la respuesta es estrictamente {text, visualization}; no
      // llega ni tool name ni objeto crudo. La tool se resuelve con titlePrefix
      // sobre EXPORT_TEMPLATES; track_package se reconstruye parseando el texto
      // determinista de format_tracking. CSV y XLSX comparten la misma matriz,
      // de modo que ambos formatos exportan exactamente lo que ve el usuario.

      // RFC 4180: escapa comillas, comas y saltos de línea.
      function csvEscape(v) {
        const s = v == null ? "" : String(v);
        return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }

      // Matriz [][] = fila de headers + filas de datos. Fuente de verdad:
      // {labels, series} cuando está disponible; si no, el objeto track_package
      // se vierte como fila única.
      function buildExportMatrix(ctx) {
        if (ctx.obj) {
          const tpl = ctx.template;
          const cols = (tpl && tpl.columns) || [];
          const header = cols.map((c) => c.header);
          const row = cols.map((c) => (ctx.obj[c.key] != null ? ctx.obj[c.key] : ""));
          return [header, row];
        }
        const viz = ctx.viz;
        const header = ["Categoría", ...(viz.series || []).map((s) => s.name)];
        const rows = (viz.labels || []).map((label, i) => [
          label,
          ...(viz.series || []).map((s) => (s.values[i] != null ? s.values[i] : "")),
        ]);
        return [header, ...rows];
      }

      // BOM UTF-8 (Excel abre acentos bien) + filas separadas por CRLF.
      function buildCsv(matrix) {
        return (
          "\uFEFF" +
          matrix.map((row) => row.map(csvEscape).join(",")).join("\r\n")
        );
      }

      // Descarga vía objectURL + <a download> + revoke (mismo patrón que exportBtn).
      function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      // Fecha LOCAL (nunca UTC — evitaría desfase de día cerca de medianoche).
      function localIsoDate() {
        const d = new Date();
        const p = (n) => String(n).padStart(2, "0");
        return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
      }

      // export-{toolName}-{YYYY-MM-DD}.{ext} → p. ej. export-report_top_customers-2026-08-28.csv
      function exportFilename(toolName, ext) {
        const tpl = CONFIG.EXPORT_TEMPLATES[toolName] || GENERIC_EXPORT_TEMPLATE;
        const fn = (tpl.filename || "export-{toolName}-{date}")
          .replace("{toolName}", toolName)
          .replace("{date}", localIsoDate());
        return fn + "." + ext;
      }

      // Plantilla por tool; desconocida → genérica.
      function resolveTemplate(toolName) {
        return CONFIG.EXPORT_TEMPLATES[toolName] || GENERIC_EXPORT_TEMPLATE;
      }

      // Reconstruye el objeto de track_package desde el texto determinista de
      // format_tracking. Las líneas opcionales pueden faltar → se dejan en "".
      function parseTrackingText(text) {
        const lines = String(text).split("\n");
        const pick = (prefix) => {
          const line = lines.find((l) => l.indexOf(prefix) === 0);
          return line ? line.slice(prefix.length).trim() : "";
        };
        return {
          trackingNumber: pick("Paquete "),
          status: pick("Estado: "),
          lastUpdate: pick("Fecha actualización: "),
          origin: pick("Origen: "),
          destination: pick("Destino: "),
        };
      }

      // Resuelve el contexto de exportación. Devuelve null si no hay control
      // (viz type none/faltante y texto que no es track_package).
      function resolveExportContext(text, viz) {
        if (!viz || viz.type === "none" || !viz.type) {
          // Ruta track_package: sin viz, pero texto determinista de format_tracking.
          if (typeof text === "string" && /^Paquete .+\nEstado: /.test(text)) {
            const toolName = "track_package";
            return {
              toolName,
              viz: null,
              obj: parseTrackingText(text),
              template: resolveTemplate(toolName),
            };
          }
          return null;
        }
        // Ruta visualización: resolver tool por titlePrefix exacto sobre EXPORT_TEMPLATES.
        const title = viz.title || "";
        let toolName = null;
        Object.keys(CONFIG.EXPORT_TEMPLATES).forEach((key) => {
          if (toolName) return;
          const entry = CONFIG.EXPORT_TEMPLATES[key];
          if (entry && entry.titlePrefix && title.indexOf(entry.titlePrefix) === 0) {
            toolName = key;
          }
        });
        if (!toolName) toolName = "viz"; // sin entrada → nombre genérico + plantilla genérica
        return { toolName, viz, obj: null, template: resolveTemplate(toolName) };
      }

      // Carga perezosa de SheetJS: se inyecta el script solo al pedir XLSX por
      // primera vez; xlsxPromise se resetea en error/timeout para reintentar.
      let xlsxPromise = null;
      function loadSheetJS() {
        if (window.XLSX) return Promise.resolve(window.XLSX);
        if (xlsxPromise) return xlsxPromise;
        xlsxPromise = new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = CONFIG.SHEETJS_CDN;
          s.onload = () => {
            if (window.XLSX) {
              resolve(window.XLSX);
            } else {
              xlsxPromise = null;
              reject(new Error("XLSX missing after load"));
            }
          };
          s.onerror = () => {
            xlsxPromise = null;
            reject(new Error("SheetJS CDN failed"));
          };
          document.head.appendChild(s);
          setTimeout(() => {
            xlsxPromise = null;
            reject(new Error("SheetJS load timeout"));
          }, 10000);
        });
        return xlsxPromise;
      }

      // Construye el workbook desde la matriz (misma que el CSV): headers,
      // anchos, autoFilter, freeze y estilo del header según la plantilla.
      function buildWorkbook(matrix, tpl) {
        const ws = XLSX.utils.aoa_to_sheet(matrix);
        if (tpl.columns && tpl.columns.length) {
          ws["!cols"] = tpl.columns.map((c) => ({ wch: c.width }));
        }
        if (tpl.autoFilter) ws["!autofilter"] = { ref: ws["!ref"] };
        if (tpl.freezePane) {
          ws["!freeze"] = Object.assign({ xSplit: 0, topLeftCell: "A2" }, tpl.freezePane);
        }
        if (tpl.headerStyle) {
          const range = XLSX.utils.decode_range(ws["!ref"]);
          for (let c = range.s.c; c <= range.e.c; c++) {
            const addr = XLSX.utils.encode_cell({ r: 0, c });
            if (!ws[addr]) ws[addr] = { t: "s", v: "" };
            const cellStyle = { font: { bold: !!tpl.headerStyle.bold } };
            if (tpl.headerStyle.bg) {
              cellStyle.fill = { patternType: "solid", fgColor: { rgb: tpl.headerStyle.bg } };
            }
            if (tpl.headerStyle.color) {
              cellStyle.font.color = { rgb: tpl.headerStyle.color };
            }
            ws[addr].s = cellStyle;
          }
        }
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, (tpl.sheetName || "Datos").slice(0, 31));
        return wb;
      }

      // Dispara una exportación. Nunca rompe el pipeline del chat: todo va en
      // try/catch; si XLSX falla, hace fallback automático a CSV de la misma matriz.
      async function runExport(ctx, format) {
        try {
          const matrix = buildExportMatrix(ctx);
          if (format === "xlsx") {
            try {
              const XLSXLib = await loadSheetJS();
              const wb = buildWorkbook(matrix, ctx.template);
              const data = XLSXLib.write(wb, { type: "array", bookType: "xlsx" });
              const blob = new Blob([data], {
                type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
              });
              downloadBlob(blob, exportFilename(ctx.toolName, "xlsx"));
              showToast("Exported " + ctx.toolName + " as XLSX");
            } catch (err) {
              console.error("xlsx export", err);
              showToast("XLSX unavailable — exported CSV instead");
              const csv = buildCsv(matrix);
              downloadBlob(new Blob([csv], { type: "text/csv;charset=utf-8;" }), exportFilename(ctx.toolName, "csv"));
            }
            return;
          }
          const csv = buildCsv(matrix);
          downloadBlob(new Blob([csv], { type: "text/csv;charset=utf-8;" }), exportFilename(ctx.toolName, "csv"));
          showToast("Exported " + ctx.toolName + " as CSV");
        } catch (err) {
          console.error("export", err);
          showToast("Export failed");
        }
      }

      // Toolbar Export ▾ con submenú [CSV / XLSX]. Cierra con click fuera o Escape;
      // los ítems se deshabilitan mientras corre una exportación.
      function renderExportToolbar(parentEl, ctx) {
        if (!ctx) return;

        const toolbar = document.createElement("div");
        toolbar.className = "zc-viz-toolbar";

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "zc-export-btn";
        btn.textContent = "Export ▾";
        btn.title = "Export visualization";
        btn.setAttribute("aria-haspopup", "menu");
        btn.setAttribute("aria-expanded", "false");

        const menu = document.createElement("div");
        menu.className = "zc-export-menu";
        menu.setAttribute("role", "menu");

        let busy = false;
        function setBusy(b) {
          busy = b;
          btn.disabled = b;
          Array.prototype.forEach.call(menu.querySelectorAll("button"), (it) => {
            it.disabled = b;
          });
        }

        function onDocClick(e) {
          if (!toolbar.contains(e.target)) closeMenu();
        }
        function onDocKey(e) {
          if (e.key === "Escape") closeMenu();
        }
        function closeMenu() {
          menu.classList.remove("open");
          btn.setAttribute("aria-expanded", "false");
          document.removeEventListener("click", onDocClick);
          document.removeEventListener("keydown", onDocKey);
        }
        function openMenu() {
          menu.classList.add("open");
          btn.setAttribute("aria-expanded", "true");
          document.addEventListener("click", onDocClick);
          document.addEventListener("keydown", onDocKey);
        }

        function addItem(label, format) {
          const item = document.createElement("button");
          item.type = "button";
          item.textContent = label;
          item.setAttribute("role", "menuitem");
          item.addEventListener("click", () => {
            closeMenu();
            setBusy(true);
            runExport(ctx, format).then(() => setBusy(false));
          });
          menu.appendChild(item);
        }

        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          if (busy) return;
          if (menu.classList.contains("open")) closeMenu();
          else openMenu();
        });

        addItem("CSV", "csv");
        addItem("XLSX", "xlsx");

        toolbar.appendChild(btn);
        toolbar.appendChild(menu);
        parentEl.appendChild(toolbar);
      }

      function renderMessageNode(content, role) {
        // Intentar parsear JSON envelope (text + visualization) de mensajes AI
        let text = content;
        let viz = null;
        if (role === "ai" && typeof content === "string") {
          try {
            const parsed = JSON.parse(content);
            if (parsed && typeof parsed === "object" && parsed.text != null) {
              text = parsed.text;
              viz = parsed.visualization || null;
            }
          } catch (e) {
            // Fallback: reparar JSON con newlines literales (mensajes de DB)
            try {
              const repaired = repairJson(content);
              const parsed = JSON.parse(repaired);
              if (parsed && typeof parsed === "object" && parsed.text != null) {
                text = parsed.text;
                viz = parsed.visualization || null;
              }
            } catch (e2) {
              // Texto plano — respuesta de answer/clarify/error (sin viz)
            }
          }
        }
        const div = document.createElement("div");
        div.className = `message ${role}`;
        div.textContent = text;
        messageList.appendChild(div);
        if (viz && viz.type && viz.type !== "none") {
          renderVisualization(viz, messageList);
          scrollToBottom();
        } else if (role === "ai") {
          // Ruta track_package: sin viz, el control sale bajo el mensaje de texto.
          renderExportToolbar(div, resolveExportContext(text, viz));
        }
      }

      function addMessage(content, role) {
        // Ocultar bienvenida si es el primer mensaje
        if (welcomeScreen) {
          welcomeScreen.classList.add("hidden");
          messageList.classList.remove("hidden");
        }

        renderMessageNode(content, role);
        state.messages.push({ role, content });
        persistCurrentConversation();
        scrollToBottom();
      }

      let stillWorkingTimer = null;

      function showThinking() {
        const div = document.createElement("div");
        div.className = "thinking";
        div.id = "thinkingIndicator";
        div.innerHTML =
          '<span class="dots">' +
          '<span class="dot"></span><span class="dot"></span><span class="dot"></span>' +
          "</span>" +
          '<span class="thinking-label">Thinking…</span>';
        messageList.appendChild(div);
        scrollToBottom();

        // Señal de vida: si el agente tarda, avisar que sigue trabajando
        clearTimeout(stillWorkingTimer);
        stillWorkingTimer = setTimeout(() => {
          const indicator = document.getElementById("thinkingIndicator");
          if (indicator) {
            indicator.classList.add("still-working");
            const label = indicator.querySelector(".thinking-label");
            if (label) label.textContent = "Still working…";
          }
        }, 10000);
      }

      function removeThinking() {
        clearTimeout(stillWorkingTimer);
        const indicator = document.getElementById("thinkingIndicator");
        if (indicator) indicator.remove();
      }

      function scrollToBottom() {
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }

      // ================================================================
      // 3.9  Envío de mensajes (sendMessage)
      // ================================================================
      async function sendMessage() {
        const content = chatInput.value.trim();
        if (!content || state.isLoading) return;

        ensureCurrentConversation();
        addMessage(content, "user");
        chatInput.value = "";
        chatInput.style.height = "auto";
        sendBtn.disabled = true;
        state.isLoading = true;

        showThinking();

        try {
          const result = await historyStore.send(state.currentConv.id, content);
          removeThinking();
          if (result.ok) {
            // result.reply es el envelope JSON: {"text":"...","visualization":{...}}
            // renderMessageNode parsea internamente y renderiza texto + viz.
            addMessage(result.reply, "ai");
          } else {
            addMessage(
              result.error || "Lo siento, hubo un error al procesar tu solicitud.",
              "ai",
            );
          }
          if (BACKEND_MODE === "server") {
            // Sincronizar metadatos (título/actividad) con el servidor
            await historyStore.refreshSessions();
            renderSidebar();
          }
        } catch (err) {
          removeThinking();
          addMessage(
            "Lo siento, hubo un error al procesar tu solicitud. Por favor intenta de nuevo.",
            "ai",
          );
          console.error(err);
        } finally {
          state.isLoading = false;
          sendBtn.disabled = chatInput.value.trim() === "";
        }
      }

      // ================================================================
      // 3.10  Eventos (listeners)
      // ================================================================
      // Manejar entrada de texto
      chatInput.addEventListener("input", () => {
        chatInput.style.height = "auto";
        chatInput.style.height = chatInput.scrollHeight + "px";
        sendBtn.disabled = !chatInput.value.trim();
      });

      chatInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          if (!sendBtn.disabled) sendMessage();
        }
      });

      sendBtn.addEventListener("click", sendMessage);

  // -------------------------------------------------------------------
  // Sugerencias UI — desde CONFIG.suggestions (fuente única, ver CONFIG arriba).
  // El Widget SDK v1 NO expone ZOHO.CREATOR.API.invoke, así que no hay llamada
  // a API: los botones se renderizan desde el array local y disparan sendMessage
  // con un prompt natural que Zia enruta a la tool correspondiente.
  // -------------------------------------------------------------------
  function loadSuggestions() {
    renderSuggestionButtons(CONFIG.suggestions || []);
  }

  function renderSuggestionButtons(suggestions) {
    const list = suggestions.slice().sort(function (a, b) {
      return (a.order || 0) - (b.order || 0);
    });
    const container = document.getElementById("suggestionsContainer");
    if (!container) return;
    container.innerHTML = "";
    list.forEach(function (s) {
      if (s.enabled === false) return; // saltar desactivadas
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "suggestion-chip";
      const icon = document.createElement("span");
      icon.className = "suggestion-icon";
      icon.textContent = s.icon || "💡";
      const label = document.createElement("span");
      label.textContent = s.label;
      btn.appendChild(icon);
      btn.appendChild(label);
      btn.addEventListener("click", function () {
        // Prompt natural enrutable por Zia (fallback: label del botón)
        useSuggestion(s.prompt || s.label);
      });
      container.appendChild(btn);
    });
  }

  function useSuggestion(text) {
    chatInput.value = text;
    chatInput.dispatchEvent(new Event("input"));
    sendMessage();
  }

  window.addEventListener("load", function () {
    loadSuggestions();
  });

  // -------------------------------------------------------------------
  // Fin de inserción de sugerencias dinámicas
  // -------------------------------------------------------------------



      toggleSidebarBtn.addEventListener("click", () => {
        if (mq.matches) {
          const open = sidebar.classList.toggle("open");
          backdrop.classList.toggle("visible", open);
        } else {
          const collapsed = sidebar.classList.toggle("collapsed");
          try {
            localStorage.setItem(COLLAPSED_KEY, collapsed ? "1" : "0");
          } catch (err) {
            console.error(err);
          }
        }
      });

      backdrop.addEventListener("click", () => {
        sidebar.classList.remove("open");
        backdrop.classList.remove("visible");
      });

      newChatBtn.addEventListener("click", newChat);

      conversationList.addEventListener("click", (e) => {
        const del = e.target.closest(".conversation-delete");
        const item = e.target.closest(".conversation-item");
        if (!item) return;
        if (del) {
          e.stopPropagation();
          deleteConversation(item.dataset.id);
          return;
        }
        selectConversation(item.dataset.id);
      });

      // Export / Import (copia de seguridad sin llamadas a API)
      exportBtn.addEventListener("click", () => {
        try {
          const convs = historyStore.list();
          const blob = new Blob([JSON.stringify(convs, null, 2)], {
            type: "application/json",
          });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "lm2chatbot-conversations.json";
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          showToast("Exported " + convs.length + " conversations");
        } catch (err) {
          console.error("export", err);
          showToast("Export failed");
        }
      });

      importBtn.addEventListener("click", () => importInput.click());

      importInput.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (BACKEND_MODE === "server") {
          showToast("Import is only available in local mode");
          e.target.value = "";
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            const arr = Array.isArray(parsed) ? parsed : parsed.conversations || [];
            const valid = arr
              .filter((c) => c && c.id && Array.isArray(c.messages))
              .slice(0, MAX_CONVERSATIONS);
            localSaveAll(valid);
            renderSidebar();
            if (!state.currentConv || !valid.some((c) => c.id === state.currentConv.id)) {
              newChat();
            }
            showToast("Imported " + valid.length + " conversations");
          } catch (err) {
            console.error("import", err);
            showToast("Import failed: invalid JSON");
          }
        };
        reader.readAsText(file);
        e.target.value = "";
      });

      // ================================================================
      // 3.11  Init (arranque)
      // ================================================================
      async function init() {
        // 1) Resolver el modo backend (server si la JS API de Creator está lista)
        BACKEND_MODE = await resolveBackendMode();
        historyStore.mode = BACKEND_MODE;
        // 2) Cargar el historial con el modo ya decidido
        await historyStore.init();
        renderSidebar();
        applyViewportMode();
        // 3) Nueva conversación en la pantalla de inicio en cada carga.
        //    El usuario carga una conversación anterior manualmente desde el sidebar.
        newChat();
      }

init();
    </script>
  </body>
